<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rain Garden</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="rain" aria-label="Calm garden idle game"></canvas>
  <div class="version" id="version">v0.5.0</div>

  <section class="hud" id="hud" aria-label="Garden summary">
    <div>
      <span class="hud-title">Rain Garden</span>
      <span class="hud-water" id="water">0</span>
    </div>
    <div class="hud-side">
      <div id="rate">0/s</div>
      <div id="stage">Seedbed</div>
    </div>
  </section>

  <section class="sheet" id="statsPanel" aria-label="Garden stats" aria-hidden="true">
    <div class="sheet-header">
      <h1 class="sheet-title">Garden stats</h1>
      <button class="close-button" data-close="statsPanel" aria-label="Close garden stats">×</button>
    </div>
    <div class="stat"><span>Water</span><span class="value" id="waterDetail">0</span></div>
    <div class="stat"><span>Per second</span><span class="value" id="rateDetail">0/s</span></div>
    <div class="stat"><span>Garden</span><span class="value" id="stageDetail">Seedbed</span></div>
    <div class="stat"><span>Next</span><span class="value" id="nextMilestone">Mossy Ground</span></div>
    <div class="stat"><span>Progress</span><span class="value" id="milestoneProgress">0 / 100</span></div>
    <div class="stat"><span>Saved</span><span class="value" id="saved">now</span></div>
  </section>

  <section class="sheet" id="shopPanel" aria-label="Garden upgrades" aria-hidden="true">
    <div class="sheet-header">
      <h1 class="sheet-title">Upgrades</h1>
      <button class="close-button" data-close="shopPanel" aria-label="Close upgrades">×</button>
    </div>
    <button class="upgrade" data-upgrade="clouds"><strong>More Clouds <span class="level" id="cloudsLevel">Level 0</span></strong><span>Rain falls more often. Cost: <b id="cloudsCost">12</b> water.</span></button>
    <button class="upgrade" data-upgrade="ripples"><strong>Deeper Ripples <span class="level" id="ripplesLevel">Level 0</span></strong><span>Each landing gives more water. Cost: <b id="ripplesCost">25</b> water.</span></button>
    <button class="upgrade" data-upgrade="mist"><strong>Mist Catcher <span class="level" id="mistLevel">Level 0</span></strong><span>Generates passive and offline water. Cost: <b id="mistCost">50</b> water.</span></button>
    <button class="utility" id="reset">Reset garden</button>
  </section>

  <nav class="bottom-nav" aria-label="Game panels">
    <button class="nav-button" data-panel="statsPanel" aria-expanded="false">Stats</button>
    <button class="nav-button" data-panel="shopPanel" aria-expanded="false">Upgrades</button>
  </nav>

  <button class="dev-toggle" id="devToggle" type="button">Dev</button>
  <section class="dev-panel" id="devPanel" aria-label="Developer tools">
    <button class="dev-button" data-dev="water100">+100 water</button>
    <button class="dev-button" data-dev="water1000">+1k water</button>
    <button class="dev-button" data-dev="nextMilestone">Next milestone</button>
    <button class="dev-button" data-dev="golden">Force golden</button>
    <button class="dev-button" data-dev="cloud">+1 Cloud</button>
    <button class="dev-button" data-dev="ripple">+1 Ripple</button>
    <button class="dev-button" data-dev="mist">+1 Mist</button>
    <button class="dev-button" data-dev="reset">Reset save</button>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="caption">calm rain garden</div>
  <script src="src/game.js" defer></script>
</body>
</html>
